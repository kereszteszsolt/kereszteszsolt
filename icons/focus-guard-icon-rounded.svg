<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Focus Guard icon</title>
  <defs>
    <clipPath id="rounded-corners">
      <rect width="128" height="128" rx="16" ry="16"/>
    </clipPath>
  </defs>
  <image
    href="data:image/png;base64,"
    width="128"
    height="128"
    preserveAspectRatio="none"
    clip-path="url(#rounded-corners)"
  />
</svg>
