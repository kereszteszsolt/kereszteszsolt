<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="title desc">
  <title id="title">TypeNudge project poster</title>
  <desc id="desc">A forest-green typewriter with cream keys and a page showing Hello followed by the ghost-text suggestion world. Floating Aa and Tab keys add a playful touch. Predictions stay offline.</desc>
  <rect width="780" height="480" rx="24" fill="#edf3e2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="390" y="88" fill="#244733" font-size="62" font-weight="800" letter-spacing="-2">TypeNudge</text>
    <text x="390" y="132" fill="#45664c" font-size="28" font-weight="500">Offline word suggestions as you type.</text>
  </g>
  <ellipse cx="390" cy="434" rx="216" ry="17" fill="#d5dfc6"/>
  <g transform="rotate(-5 390 248)">
    <path d="M282 174h177l39 39v111H282Z" fill="#fffdf4" stroke="#d5dfc6" stroke-width="3" stroke-linejoin="round"/>
