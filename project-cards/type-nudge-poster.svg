    <text x="309" y="234" fill="#244733" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Hello</text>
    <text x="309" y="282" fill="#9aab93" font-family="Arial, Helvetica, sans-serif" font-size="35">world</text>
    <path d="M298 249v39" fill="none" stroke="#3b6c4d" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="237" y="296" width="306" height="37" rx="16" fill="#244733"/>
