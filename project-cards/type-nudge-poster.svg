  <path d="M252 320h276l9 20H243Z" fill="#6b9874"/>
  <g fill="#fff3ce">
    <rect x="246" y="352" width="29" height="25" rx="6"/>
    <rect x="283" y="352" width="29" height="25" rx="6"/>
    <rect x="320" y="352" width="29" height="25" rx="6"/>
