    <text x="144" y="259" fill="#233c39" font-size="25" font-weight="700">User story</text>
    <text x="144" y="302" fill="#59716a" font-size="23">As a user...</text>
    <path d="M144 329h144m-144 23h104" fill="none" stroke="#cedbd2" stroke-width="9" stroke-linecap="round"/>
  </g>
  <path d="M330 305h34m-12-13 13 13-13 13" fill="none" stroke="#c9dfd5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="388" y="182" width="278" height="258" rx="20" fill="#102a25" opacity="0.35"/>
  <rect x="382" y="174" width="278" height="258" rx="20" fill="#f5f7f4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="408" y="215" fill="#233c39" font-size="25" font-weight="700">Story review</text>
    <path d="M408 235h226" fill="none" stroke="#dce5de" stroke-width="3"/>
    <circle cx="425" cy="271" r="18" fill="#dcebe3"/>
    <path d="m417 271 6 6 11-13" fill="none" stroke="#26665b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="459" y="280" fill="#233c39" font-size="25" font-weight="600">Criteria</text>
    <circle cx="425" cy="326" r="18" fill="#f0e4cd"/>
