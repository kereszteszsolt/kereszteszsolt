<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="title desc">
  <title id="title">StoryCheck AI project poster</title>
  <desc id="desc">StoryCheck AI in cream on deep teal, with a user story leading to suggested acceptance criteria, clarification questions, and test cases.</desc>
  <rect width="780" height="480" rx="24" fill="#233c39"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="390" y="88" fill="#f5f7f4" font-size="62" font-weight="800" letter-spacing="-2">StoryCheck AI</text>
    <text x="390" y="132" fill="#c9dfd5" font-size="28" font-weight="500">Clearer stories. Testable next steps.</text>
  </g>
